name: windows-test-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "core/**"
      - "services/**"
      - "plugins/**"
      - "windows/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "setup.dart"
      - ".github/workflows/windows-test-build.yaml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: windows-test-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-amd64:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Windows process-filter tests
        run: flutter test test/windows_process_filter_test.dart

      - name: Setup Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows package
        run: dart setup.dart windows --arch amd64

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v6
        with:
          name: FlClashX-windows-amd64-${{ github.sha }}
          path: ./dist
          if-no-files-found: error
          retention-days: 30
